[package]
name = "rust_lib_debluev2"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
zbus = "5.19.0"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
